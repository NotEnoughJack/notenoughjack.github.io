<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox User Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
    input {
      width: 200px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: #007bff;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    section {
      margin-top: 25px;
    }
    .error {
      background: #ffe5e5;
      color: #b00000;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .list {
      background: #fafafa;
      border: 1px solid #eee;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Roblox User Info</h1>
    <div>
      <input id="userIdInput" type="number" placeholder="Enter User ID" />
      <button id="fetchBtn">Fetch Info</button>
    </div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="output"></div>
  </div>

  <script>
    const output = document.getElementById("output");
    const errorBox = document.getElementById("error");

    document.getElementById("fetchBtn").addEventListener("click", () => {
      const userId = document.getElementById("userIdInput").value.trim();
      if (!userId) {
        showError("Please enter a userId.");
        return;
      }
      fetchUserData(userId);
    });

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    function clearError() {
      errorBox.style.display = "none";
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Request failed: " + res.status);
      return res.json();
    }

    async function fetchUserData(userId) {
      clearError();
      output.innerHTML = "<p>Loading data...</p>";

      try {
        const cached = localStorage.getItem("rbx_user_" + userId);
        if (cached) {
          const parsed = JSON.parse(cached);
          renderData(parsed);
          console.log("Loaded from cache");
        }

        const [profile, outfits, friendsCount, friendsList, followers, followings, groups, badges] = await Promise.all([
          fetchJson(`https://users.roblox.com/v1/users/${userId}`),
          fetchJson(`https://avatar.roblox.com/v1/users/${userId}/outfits`),
          fetchJson(`https://friends.roblox.com/v1/users/${userId}/friends/count`),
          fetchJson(`https://friends.roblox.com/v1/users/${userId}/friends?limit=10`),
          fetchJson(`https://friends.roblox.com/v1/users/${userId}/followers/count`),
          fetchJson(`https://friends.roblox.com/v1/users/${userId}/followings?limit=10`),
          fetchJson(`https://users.roblox.com/v1/users/${userId}/groups`),
          fetchJson(`https://badges.roblox.com/v1/users/${userId}/badges?limit=100`)
        ]);

        const sortedBadges = (badges.data || []).sort((a, b) => new Date(a.awardedDate) - new Date(b.awardedDate));
        const firstGame = sortedBadges.find(b => b.awardedDate) || { name: "Unknown", awardedDate: "Unknown" };

        const data = {
          profile,
          outfits,
          friendsCount,
          friendsList,
          followers,
          followings,
          groups,
          badges: sortedBadges,
          firstGame
        };

        localStorage.setItem("rbx_user_" + userId, JSON.stringify(data));
        renderData(data);
      } catch (err) {
        console.error(err);
        showError("Error fetching data: " + err.message);
      }
    }

    function renderData(data) {
      output.innerHTML = `
        <section>
          <h2>User</h2>
          <div class="list">
            <b>${data.profile.displayName}</b> (@${data.profile.name})<br>
            Joined: ${new Date(data.profile.created).toLocaleDateString()}
          </div>
        </section>

        <section>
          <h2>Outfits (${data.outfits.data.length})</h2>
          <div class="list">
            ${data.outfits.data.map(o => `<div>${o.name}</div>`).join('') || 'No outfits found'}
          </div>
        </section>

        <section>
          <h2>Friends (${data.friendsCount.count})</h2>
          <div class="list">
            ${data.friendsList.data.map(f => `<div>${f.displayName}</div>`).join('') || 'No friends listed'}
          </div>
        </section>

        <section>
          <h2>Followers / Following</h2>
          <div class="list">
            Followers: ${data.followers.count} <br>
            Following: ${data.followings.count}
          </div>
        </section>

        <section>
          <h2>Groups (${data.groups.data.length})</h2>
          <div class="list">
            ${data.groups.data.map(g => `<div>${g.group.name} - Role: ${g.role.name}</div>`).join('') || 'No groups found'}
          </div>
        </section>

        <section>
          <h2>Badges (${data.badges.length})</h2>
          <div class="list">
            First Game Badge: ${data.firstGame.name || 'Unknown'} (${data.firstGame.awardedDate || 'Unknown'})<br><br>
            ${data.badges.map(b => `<div>${b.name} - ${b.awardedDate ? new Date(b.awardedDate).toLocaleDateString() : 'Unknown'}</div>`).join('')}
          </div>
        </section>
      `;
    }
  </script>
</body>
</html>
